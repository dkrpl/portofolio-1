<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <linearGradient id="avatar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg-grad)" />

  <!-- Subtle tech pattern circles -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="url(#accent-grad)" stroke-width="2" opacity="0.5" />

  <!-- Avatar body / shoulders -->
  <path d="M120 330 C120 270, 150 250, 200 250 C250 250, 280 270, 280 330 Z" fill="url(#avatar-grad)" stroke="#475569" stroke-width="2" />

  <!-- Avatar head -->
  <circle cx="200" cy="180" r="55" fill="url(#avatar-grad)" stroke="#475569" stroke-width="2" />

  <!-- Coding accent elements: brackets < / > -->
  <path d="M80 170 L60 190 L80 210" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />
  <path d="M320 170 L340 190 L320 210" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <!-- Initials Badge / Monogram -->
  <circle cx="200" cy="180" r="42" fill="#0f172a" opacity="0.9" />
  <text x="200" y="193" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="700" fill="url(#accent-grad)" text-anchor="middle" letter-spacing="1">DK</text>
  
  <!-- Status dot (Active / Available) -->
  <circle cx="270" cy="235" r="10" fill="#10b981" stroke="#020617" stroke-width="3" filter="url(#glow)" />
</svg>

